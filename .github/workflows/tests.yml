name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.22"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked CPU dependency set
        run: |
          uv sync --frozen --extra cpu
          uv run --frozen --extra cpu python -c "from importlib.metadata import distributions, version; import torch; expected={'torch':'2.9.1+cpu','torchaudio':'2.9.1+cpu','fairseq2':'0.8.1','fairseq2n':'0.8.1'}; actual={name:version(name) for name in expected}; assert actual == expected, actual; assert torch.version.cuda is None, torch.version.cuda; nvidia=sorted(d.metadata['Name'] for d in distributions() if d.metadata['Name'] and d.metadata['Name'].lower().startswith('nvidia-')); assert not nvidia, nvidia"
      - name: Run tests
        run: uv run --frozen --extra cpu pytest -q
