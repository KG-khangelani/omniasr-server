[project]
name = "omniasr-server"
version = "0.1.0"
description = "High-performance Omnilingual-ASR model server with OpenAI Whisper-compatible API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "omnilingual-asr==0.2.0",
    "soundfile==0.14.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",

    # Keep this model stack aligned with the fairseq2 pt2.9.1/cu126 wheel index.
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "fairseq2==0.8.1",
    "fairseq2n==0.8.1",
]

[dependency-groups]
dev = ["debugpy==1.8.22", "httpx==0.28.1", "pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# omnilingual-asr 0.2.0 still declares fairseq2<=0.6.0, but fairseq2 publishes
# an official PyTorch 2.9.1/CUDA 12.6 build. Keep the compatibility override
# explicit until omnilingual-asr updates its package metadata.
override-dependencies = ["fairseq2==0.8.1"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]
fairseq2 = [
    { index = "fairseq2-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "fairseq2-cu126", marker = "sys_platform != 'darwin'" },
]
fairseq2n = [
    { index = "fairseq2-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "fairseq2-cu126", marker = "sys_platform != 'darwin'" },
]


[[tool.uv.index]]
name = "fairseq2-cu126"
url = "https://fair.pkg.atmeta.com/fairseq2/whl/pt2.9.1/cu126"

[[tool.uv.index]]
name = "fairseq2-cpu"
url = "https://fair.pkg.atmeta.com/fairseq2/whl/pt2.9.1/cpu"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
